<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
    /* GÖRÜNÜM (Masaüstü / Mobil) — index.html ve game.html ortak. Tercih localStorage 'px_layout'.
       Masaüstü: sabit orantılı 1100px ölçek (telefonda küçülterek sığdırır). Mobil: esnek, ekrana yayılan düzen. */
    (function () {
        var KEY = 'px_layout', root = document.documentElement;
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'mobile' || v === 'desktop') ? v : null; } catch (e) { return null; } }
        function auto() { try { return (matchMedia('(pointer:coarse)').matches || Math.min(screen.width, screen.height) < 700) ? 'mobile' : 'desktop'; } catch (e) { return 'desktop'; } }
        function apply(m) {
            window.PX_LAYOUT = m;
            root.classList.remove('layout-desktop', 'layout-mobile'); root.classList.add('layout-' + m);
            var v = document.querySelector('meta[name="viewport"]');
            if (v) v.setAttribute('content', m === 'desktop' ? 'width=1100' : 'width=device-width, initial-scale=1, viewport-fit=cover');
            var bs = document.querySelectorAll('[data-layout]');
            for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', bs[i].getAttribute('data-layout') === m);
            try { window.dispatchEvent(new Event('pxlayout')); } catch (e) { /* */ }
        }
        window.pxSetLayout = function (m) { m = (m === 'mobile') ? 'mobile' : 'desktop'; try { localStorage.setItem(KEY, m); } catch (e) { /* */ } apply(m); };
        window.pxSyncLayoutButtons = function () { apply(window.PX_LAYOUT); };
        window.PX_LAYOUT = stored() || auto(); apply(window.PX_LAYOUT);
    })();
    </script>
    <title>Pixel Strategy Game</title>
    <link rel="icon" href="data:,">
    <!-- Sunucu (server.js) bu etikete kendi wss:// adresini yazar. Statik barındırıyorsan kendi adresini yaz:
         content="wss://oyun.siten.com/ws"   (boş = çevrimdışı/botlu mod) -->
    <meta name="px-ws-url" content="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-image: url('map.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;
            color: white;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        .top-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            background-color: rgba(0, 0, 0, 0.75);

        }

        .flag-section, .country-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* BAYRAK: oran 30x15'e KİLİTLİ (her zaman 2:1; tam sayı katları) */
        #miniFlagCanvas {
            border: 4px solid #fff;
            background-color: white;
            cursor: pointer;
            image-rendering: pixelated;
            width: 120px;
            height: 60px;
        }

        .pixel-btn {
            background-color: #2ecc71;
            color: black;
            border: 3px solid #fff;
            padding: 8px 12px;
            font-size: 10px;
            font-family: 'Press Start 2P', monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }
        .pixel-btn:hover { background-color: #27ae60; color: white; }
        .pixel-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

        #countryInput {
            background-color: #d3d3d3;
            border: 4px solid #fff;
            padding: 12px 20px;
            font-size: 12px;
            font-family: 'Press Start 2P', monospace;
            color: black;
            text-align: center;
            width: 280px;
            outline: none;
        }
        #countryInput.err { border-color: #e74c3c; }

        .point-box {
            background-color: #d3d3d3;
            border: 4px solid #fff;
            padding: 12px 20px;
            font-size: 10px;
            line-height: 1.7;
            color: black;
            box-shadow: 3px 3px 0px #000;
            text-align: center;
        }
        .point-box b { font-size: 16px; color: #b45309; }

        .menu-area { display: flex; flex-direction: column; gap: 18px; align-items: center; width: 100%; max-width: 780px; margin: 0 auto; }

        .menu-btn {
            background-color: #d3d3d3;
            border: 4px solid #fff;
            color: black;
            font-size: 16px;
            font-family: 'Press Start 2P', monospace;
            padding: 15px 50px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #000;
            transition: 0.1s;
        }
        .menu-btn:hover { background-color: #e0e0e0; transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #000; }
        .menu-btn.play { background: #2ecc71; }

        /* ====================== SUNUCU TARAYICISI (canlı oda havuzu) ====================== */
        .server-panel { width: 100%; background: rgba(8, 14, 32, 0.93); border: 4px solid #fff; box-sizing: border-box; box-shadow: 5px 5px 0 #000; }
        .sp-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 3px solid #fff; font-size: 11px; gap: 10px; flex-wrap: wrap; }
        .sp-mode { font-size: 8px; color: #f1c40f; }
        .sp-live { font-size: 7px; color: #2ecc71; display: flex; align-items: center; gap: 6px; }
        .sp-live::before { content: ''; width: 8px; height: 8px; background: #2ecc71; box-shadow: 0 0 0 2px #000; animation: blink 1s steps(2) infinite; }
        .sp-live.off { color: #94a3b8; } .sp-live.off::before { background: #94a3b8; animation: none; }
        @keyframes blink { 50% { opacity: 0.25; } }
        .sp-tabs { display: flex; border-bottom: 3px solid #fff; }
        .sp-tab { flex: 1; font-family: 'Press Start 2P', monospace; font-size: 9px; line-height: 1.6; padding: 10px 6px; background: #111b33; color: #94a3b8; border: 0; border-right: 3px solid #fff; cursor: pointer; }
        .sp-tab:last-child { border-right: 0; }
        .sp-tab:hover { color: #fff; }
        .sp-tab.active { background: #2ecc71; color: #000; }
        .sp-tab.duel.active { background: #f39c12; }
        .sp-tab .cnt { display: block; font-size: 7px; margin-top: 3px; }
        .sp-list { max-height: 320px; overflow-y: auto; }
        .sp-row { display: grid; grid-template-columns: 1.1fr 1.7fr 1.3fr 96px; gap: 10px; align-items: center; padding: 9px 12px; font-size: 8px; border-bottom: 2px solid #334155; line-height: 1.6; }
        .sp-row.hdr { color: #94a3b8; font-size: 7px; }
        .sp-row.fresh { animation: fresh 1.2s ease-out; }
        @keyframes fresh { 0% { background: #f39c12; } 100% { background: transparent; } }
        .rm-name { color: #fff; font-size: 9px; }
        .rm-bar { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; flex: 1; min-width: 0; }
        .seg { height: 10px; background: #1e293b; border: 1px solid #334155; }
        .seg.on { background: #2ecc71; border-color: #000; }
        .segs.hot .seg.on { background: #f39c12; }
        .segs.duel .seg { height: 14px; }
        .rm-cnt { font-size: 9px; color: #fff; white-space: nowrap; }
        .rm-info.st-wait { color: #2ecc71; } .rm-info.st-start { color: #f39c12; } .rm-info.st-idle { color: #94a3b8; }
        .sp-empty { padding: 16px 12px; font-size: 8px; color: #94a3b8; line-height: 1.8; }
        .sp-note { padding: 8px 12px; font-size: 7px; color: #f39c12; line-height: 1.7; border-top: 2px solid #334155; }
        .sp-foot { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 3px solid #fff; font-size: 7px; flex-wrap: wrap; }
        .sp-foot input { flex: 1; min-width: 200px; background: #d3d3d3; border: 3px solid #fff; padding: 8px; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #000; outline: none; }
        .sp-btn { font-size: 8px; padding: 6px 9px; }
        .menu-btn.duel { background: #f39c12; }
        .menu-btn.duel:hover { background: #ffb340; }
        .btn-row2 { display: flex; gap: 14px; width: 100%; justify-content: center; flex-wrap: wrap; }

        /* GÖRÜNÜM TOGGLE (sağ üst, sabit) */
        .layout-toggle { position: fixed; top: 8px; right: 8px; z-index: 900; display: flex; align-items: center; gap: 6px; background: rgba(8, 14, 32, 0.95); border: 3px solid #fff; padding: 4px 6px; box-shadow: 3px 3px 0 #000; font-size: 7px; }
        .lt-btn { font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 7px 8px; background: #334155; color: #fff; border: 2px solid #fff; cursor: pointer; }
        .lt-btn.active { background: #2ecc71; color: #000; }
        #largeFlagCanvas { touch-action: none; }

        /* ====================== GÖRÜNÜM: MASAÜSTÜ (sabit orantılı) / MOBİL (esnek) ====================== */
        html.layout-desktop body { min-width: 980px; padding-top: 52px; }
        html.layout-mobile body { padding: 54px 8px 18px; }
        html.layout-mobile .lt-label { display: none; }
        html.layout-mobile .top-container { flex-direction: column; align-items: center; gap: 14px; padding: 10px; border-width: 3px; }
        html.layout-mobile #countryInput { width: min(300px, 80vw); font-size: 11px; box-sizing: border-box; }
        html.layout-mobile .point-box { width: min(300px, 80vw); box-sizing: border-box; }
        html.layout-mobile .menu-area { max-width: 600px; gap: 14px; }
        html.layout-mobile .top-container { max-width: 600px; }
        html.layout-mobile .menu-btn { font-size: 12px; padding: 14px 10px; width: 100%; box-sizing: border-box; }
        html.layout-mobile .btn-row2 { flex-direction: column; gap: 14px; }
        html.layout-mobile .sp-head { font-size: 10px; padding: 8px 10px; }
        html.layout-mobile .sp-tab { font-size: 8px; padding: 10px 3px; }
        html.layout-mobile .sp-row.hdr { display: none; }
        html.layout-mobile .sp-row { grid-template-columns: 1fr auto; grid-template-areas: "name btn" "bar bar" "info info"; gap: 6px 10px; padding: 10px; }
        html.layout-mobile .rm-name { grid-area: name; } html.layout-mobile .rm-bar { grid-area: bar; } html.layout-mobile .rm-info { grid-area: info; } html.layout-mobile .sp-row .sp-btn { grid-area: btn; padding: 10px 12px; }
        html.layout-mobile .sp-foot { flex-direction: column; align-items: stretch; }
        html.layout-mobile .sp-foot input { min-width: 0; width: 100%; box-sizing: border-box; font-size: 9px; padding: 10px; }
        html.layout-mobile .sp-list { max-height: none; overflow: visible; }
        html.layout-mobile #flagModal, html.layout-mobile #settingsModal { padding: 10px 6px; }
        html.layout-mobile #largeFlagCanvas { width: min(480px, 94vw); height: auto; aspect-ratio: 2 / 1; }
        html.layout-mobile .fe-right { width: min(340px, 94vw); box-sizing: border-box; }
        html.layout-mobile .fe-left { max-width: 100%; }
        html.layout-mobile .tool-btn { padding: 10px 8px; font-size: 8px; }
        html.layout-mobile .color-picker-container { flex-wrap: wrap; justify-content: center; }
        html.layout-mobile .settings-content { width: min(400px, 88vw); padding: 18px; box-sizing: border-box; }
        html.layout-mobile #feTitle { font-size: 10px !important; text-align: center; }
        html.layout-mobile .action-icon-btn { width: 56px; height: 56px; }

        /* Bayrak ve Ayarlar Modalları */
        #flagModal, #settingsModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            overflow-y: auto;
            padding: 16px 10px;
            box-sizing: border-box;
        }
        #settingsModal { justify-content: center; }
        #largeFlagCanvas {
            border: 4px solid white;
            background-color: white;
            cursor: crosshair;
            image-rendering: pixelated;
            width: 480px;       /* 30x15 * 16: oran kilitli */
            height: 240px;
            display: block;
        }
        .fe-main { display: flex; gap: 18px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
        .fe-left { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .fe-right { display: flex; flex-direction: column; gap: 8px; width: 330px; background: #111; border: 2px solid #fff; padding: 10px; }
        .fe-title { font-size: 8px; color: #f1c40f; margin-top: 4px; }
        .fe-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .fe-grid button { background: #222; border: 2px solid #666; padding: 3px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .fe-grid button.sel { border-color: #2ecc71; background: #0b3b2e; }
        .fe-grid canvas { image-rendering: pixelated; display: block; }
        .fe-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 8px; }
        .fe-row input[type=color] { width: 44px; height: 28px; border: 2px solid #fff; background: #000; padding: 0; cursor: pointer; }
        .editor-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .tool-btn { padding: 8px 10px; font-size: 9px; font-family: 'Press Start 2P', monospace; background-color: #444; color: white; border: 2px solid white; cursor: pointer; }
        .tool-btn.active { background-color: #007bff; }
        .color-picker-container { display: flex; align-items: center; gap: 12px; background: #111; padding: 8px 14px; border: 2px solid #fff; }
        .color-preview { width: 35px; height: 35px; border: 2px solid white; }
        .slider-group { display: flex; flex-direction: column; gap: 4px; font-size: 8px; }
        .slider-group label { display: flex; justify-content: space-between; gap: 10px; }
        .modal-actions { display: flex; gap: 25px; margin-top: 5px; }
        .action-icon-btn { width: 45px; height: 45px; font-size: 18px; font-weight: bold; border: 2px solid white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-cancel { background-color: #dc3545; color: white; }
        .btn-save { background-color: #28a745; color: white; }
        .settings-content { background-color: #111; border: 4px solid #fff; padding: 30px; display: flex; flex-direction: column; gap: 20px; align-items: center; width: 400px; box-shadow: 5px 5px 0px #000; }
        .lang-options { display: flex; gap: 10px; }
        .lang-btn { padding: 8px 15px; font-family: 'Press Start 2P', monospace; font-size: 10px; background-color: #444; color: white; border: 2px solid white; cursor: pointer; }
        .lang-btn.active { background-color: #2ecc71; color: black; }
        .dev-info { font-size: 9px; color: #aaa; text-align: center; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- GÖRÜNÜM: Masaüstü / Mobil -->
    <div class="layout-toggle" id="layoutToggle">
        <span class="lt-label" id="ltLabel">GÖRÜNÜM:</span>
        <button class="lt-btn" data-layout="desktop" id="ltDesktop" onclick="pxSetLayout('desktop')">MASAÜSTÜ</button>
        <button class="lt-btn" data-layout="mobile" id="ltMobile" onclick="pxSetLayout('mobile')">MOBİL</button>
    </div>

    <div class="top-container">
        <div class="flag-section">
            <canvas id="miniFlagCanvas" width="30" height="15" onclick="openFlagEditor()"></canvas>
            <button class="pixel-btn" id="editFlagBtn" onclick="openFlagEditor()">BAYRAĞI DÜZENLE</button>
        </div>
        <div class="country-section">
            <input type="text" id="countryInput" maxlength="16" placeholder="ÜLKE ADI" autocomplete="off">
        </div>
        <div class="point-box" id="pointBox"><span id="expLabel">SAVAŞ DENEYİMİ</span><br><b id="expVal">0</b></div>
    </div>

    <div class="menu-area">
        <div class="server-panel">
            <div class="sp-head">
                <span id="spTitle">SUNUCULAR</span>
                <span class="sp-live off" id="spLive">…</span>
                <span class="sp-mode" id="spMode"></span>
                <button class="pixel-btn sp-btn" id="spRefresh" onclick="refreshServers(true)">↻ YENİLE</button>
            </div>
            <div class="sp-tabs">
                <button class="sp-tab active" id="tabLobby" onclick="setTab('lobby')"><span id="tabLobbyT">15 KİŞİLİK LOBİLER</span><span class="cnt" id="tabLobbyC"></span></button>
                <button class="sp-tab duel" id="tabDuel" onclick="setTab('duel')"><span id="tabDuelT">2 KİŞİLİK DÜELLO (1v1)</span><span class="cnt" id="tabDuelC"></span></button>
            </div>
            <div class="sp-list" id="serverList"></div>
            <div class="sp-note" id="spNote"></div>
            <div class="sp-foot">
                <span id="spUrlLabel">SUNUCU ADRESİ:</span>
                <input type="text" id="serverUrlInput" placeholder="wss://oyun.siten.com/ws  (boş = çevrimdışı, botlarla)" autocomplete="off" spellcheck="false">
                <button class="pixel-btn sp-btn" id="spApply" onclick="applyServerUrl()">BAĞLAN</button>
            </div>
        </div>
        <div class="btn-row2">
            <button class="menu-btn play" id="playBtn" onclick="playGame()">HIZLI KATIL</button>
            <button class="menu-btn duel" id="duelBtn" onclick="playDuel()">⚔ DÜELLO 1v1</button>
        </div>
        <button class="menu-btn" id="settingsBtn" onclick="goToSettings()">AYARLAR</button>
    </div>

    <!-- Piksel Bayrak Düzenleme Ekranı (30x15) -->
    <div id="flagModal">
        <h2 style="font-size: 13px; margin: 0;" id="feTitle">PİKSEL BAYRAK EDİTÖRÜ · 30×15</h2>
        <div class="fe-main">
            <div class="fe-left">
                <canvas id="largeFlagCanvas" width="30" height="15"></canvas>
                <div class="editor-tools">
                    <button id="tool-brush" class="tool-btn active" onclick="setTool('brush')">FIRÇA</button>
                    <button id="tool-bucket" class="tool-btn" onclick="setTool('bucket')">DOLDUR</button>
                    <button id="tool-line" class="tool-btn" onclick="setTool('line')">ÇİZGİ</button>
                    <button id="tool-rect" class="tool-btn" onclick="setTool('rect')">KUTU</button>
                    <button id="tool-circle" class="tool-btn" onclick="setTool('circle')">DAİRE</button>
                    <button class="tool-btn" onclick="undoFlag()">↶ GERİ AL</button>
                    <button class="tool-btn" onclick="randomFlag()">🎲 RASTGELE</button>
                </div>
                <div class="color-picker-container">
                    <div id="colorPreview" class="color-preview" style="background-color: rgb(255, 0, 0);"></div>
                    <input type="color" id="brushColorInput" value="#ff0000" style="width:44px;height:30px;border:2px solid #fff;background:#000;padding:0;cursor:pointer;" oninput="setBrushFromHex(this.value)">
                    <div class="slider-group">
                        <label>R: <span id="rVal">255</span> <input type="range" id="rangeR" min="0" max="255" value="255" oninput="updateColorFromSliders()"></label>
                        <label>G: <span id="gVal">0</span> <input type="range" id="rangeG" min="0" max="255" value="0" oninput="updateColorFromSliders()"></label>
                        <label>B: <span id="bVal">0</span> <input type="range" id="rangeB" min="0" max="255" value="0" oninput="updateColorFromSliders()"></label>
                    </div>
                </div>
            </div>
            <div class="fe-right">
                <div class="fe-title" id="feT1">DESEN</div>
                <div class="fe-grid" id="patternGrid"></div>
                <div class="fe-title" id="feT2">DESEN RENKLERİ (canlı)</div>
                <div class="fe-row">
                    <input type="color" id="pc1" value="#d32f2f" title="Renk 1"><input type="color" id="pc2" value="#ffffff" title="Renk 2"><input type="color" id="pc3" value="#1b5e20" title="Renk 3">
                    <button class="tool-btn" onclick="swapPatternColors()">⇄</button>
                </div>
                <div class="fe-title" id="feT3">SEMBOL (damga)</div>
                <div class="fe-grid" id="symbolGrid"></div>
                <div class="fe-row">
                    <span id="feSymCol">RENK:</span><input type="color" id="symColor" value="#ffd600" title="Sembol rengi">
                    <button class="tool-btn pos active" id="pos-left" onclick="setSymPos('left')">SOL</button>
                    <button class="tool-btn pos" id="pos-center" onclick="setSymPos('center')">ORTA</button>
                    <button class="tool-btn pos" id="pos-right" onclick="setSymPos('right')">SAĞ</button>
                </div>
                <div class="fe-row"><button class="tool-btn" onclick="stampBorder()" id="feBorder">ÇERÇEVE EKLE (fırça rengi)</button></div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="action-icon-btn btn-cancel" onclick="closeFlagEditor(false)">✕</button>
            <button class="action-icon-btn btn-save" onclick="closeFlagEditor(true)">✓</button>
        </div>
    </div>

    <!-- Ayarlar Ekranı -->
    <div id="settingsModal">
        <div class="settings-content">
            <h2 id="settingsTitle">AYARLAR</h2>
            <div class="setting-group" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <span id="langLabel">DİL SEÇENEĞİ:</span>
                <div class="lang-options">
                    <button id="langEn" class="lang-btn" onclick="setLanguage('en')">English</button>
                    <button id="langTr" class="lang-btn active" onclick="setLanguage('tr')">Türkçe</button>
                </div>
            </div>
            <div class="dev-info" id="devInfoText">GELİŞTİRİCİ:<br>Sadece MR_OTTO tarafından geliştirildi.</div>
            <button class="pixel-btn" onclick="closeSettings()" style="width: 100%; margin-top: 10px;" id="closeSettingsBtn">GERİ</button>
        </div>
    </div>

    <script>
        const FW = 30, FH = 15;   // bayrak ölçüsü KİLİTLİ: 30x15 piksel
        const $ = (id) => document.getElementById(id);
        const miniCanvas = $('miniFlagCanvas'), miniCtx = miniCanvas.getContext('2d');
        const largeCanvas = $('largeFlagCanvas'), largeCtx = largeCanvas.getContext('2d');
        miniCtx.imageSmoothingEnabled = false; largeCtx.imageSmoothingEnabled = false;

        function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { /* depolama kapalı */ } return null; }

        /* çizim girdisi: fare VE dokunmatik aynı mantığı kullanır (telefonda bayrak çizilebilir) */

        largeCanvas.addEventListener('touchstart', (e) => { const p = touchPt(e); if (!p) return; e.preventDefault(); fdStart(p); }, { passive: false });

        function handleBucketFill(sx, sy) {
            if (sx < 0 || sx >= FW || sy < 0 || sy >= FH) return;
            const imgData = largeCtx.getImageData(0, 0, FW, FH), data = imgData.data;
            const ti = (sy * FW + sx) * 4, tr = data[ti], tg = data[ti + 1], tb = data[ti + 2];
            if (tr === r && tg === g && tb === b) return;
            const queue = [[sx, sy]], visited = new Uint8Array(FW * FH);
            while (queue.length) {
                const [cx, cy] = queue.pop();
                if (cx < 0 || cx >= FW || cy < 0 || cy >= FH) continue;
                const idx = cy * FW + cx; if (visited[idx]) continue; visited[idx] = 1;
                const ci = idx * 4;
                if (data[ci] === tr && data[ci + 1] === tg && data[ci + 2] === tb) {
                    data[ci] = r; data[ci + 1] = g; data[ci + 2] = b; data[ci + 3] = 255;
                    queue.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
                }
            }
            largeCtx.putImageData(imgData, 0, 0);
        }

            store('px_server', ($('serverUrlInput').value || '').trim());
            try {
                sessionStorage.setItem('px_join', JSON.stringify({ room: roomId || '', url: url, mode: mode === 'duel' ? 'duel' : 'lobby' }));
                sessionStorage.setItem('px_autojoin', '1');
                sessionStorage.removeItem('px_token');
            } catch (e) { /* depolama kapalı */ }
            window.location.href = 'game.html';
        }
        function playGame() { startGame('', 'lobby'); }
        function playDuel() { startGame('', 'duel'); }
        function setTab(t) { activeTab = t === 'duel' ? 'duel' : 'lobby'; store('px_tab', activeTab); renderServers(); }

        let lastList = null, listBusy = false;
        const rowEls = new Map();
        const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
        const setText = (e, t) => { if (e.textContent !== t) e.textContent = t; };
        const idNum = (id) => parseInt(String(id).replace(/\D/g, ''), 10) || 0;

        function makeRow(initial) {
            const d = mk('div', 'sp-row' + (initial ? '' : ' fresh'));
            const r = { el: d, name: mk('span', 'rm-name'), bar: mk('div', 'rm-bar'), segs: mk('div', 'segs'), cnt: mk('span', 'rm-cnt'), info: mk('span', 'rm-info'), btn: mk('button', 'pixel-btn sp-btn'), max: 0, on: -1, dis: null, label: '' };
            r.bar.appendChild(r.segs); r.bar.appendChild(r.cnt);
            [r.name, r.bar, r.info, r.btn].forEach(x => d.appendChild(x));
            if (!initial) setTimeout(() => d.classList.remove('fresh'), 1300);
            return r;
        }
        function paintRow(r, s, now) {
            setText(r.name, String(s.name));
            if (r.max !== s.max) { r.segs.innerHTML = ''; for (let i = 0; i < s.max; i++) r.segs.appendChild(mk('i', 'seg')); r.max = s.max; r.on = -1; }
            const cls = 'segs' + (s.kind === 'duel' ? ' duel' : '') + (s.max > 2 && s.players / s.max >= 0.8 ? ' hot' : '');
            if (r.segs.className !== cls) r.segs.className = cls;
            if (r.on !== s.players) { const ch = r.segs.children; for (let i = 0; i < ch.length; i++) ch[i].classList.toggle('on', i < s.players); r.on = s.players; }
            setText(r.cnt, s.players + ' / ' + s.max);
            const el = Math.floor((now - s.at) / 1000);
            const cd = (s.countdown === null || s.countdown === undefined) ? null : Math.max(0, s.countdown - el);
            const wait = (s.wait === null || s.wait === undefined) ? null : Math.max(0, s.wait - el);
            const full = s.players >= s.max;
            let txt, st;
            if (s.infoText) { txt = s.infoText; st = 'st-wait'; }
            else if (cd !== null) { txt = tt('startsNow') + ': ' + cd + tt('sl'); st = 'st-start'; }
            else if (s.players === 0) { txt = tt('emptyRoom'); st = 'st-idle'; }
            else if (s.kind === 'duel') { txt = tt('oppWait'); st = 'st-wait'; }
            else { txt = tt('waiting') + (wait !== null ? ' · ' + tt('botIn') + ' ' + wait + tt('sl') : ''); st = 'st-wait'; }
            setText(r.info, txt); const ic = 'rm-info ' + st; if (r.info.className !== ic) r.info.className = ic;
            const label = full ? tt('full') : tt('join');
            if (r.label !== label) { r.btn.textContent = label; r.label = label; }
            if (r.dis !== full) { r.btn.disabled = full; r.dis = full; }
            r.btn.onclick = full ? null : () => startGame(s.id.indexOf('__local') === 0 ? '' : String(s.id), s.kind);
        }

        function renderServers() {
            const box = $('serverList');
            if (!box.dataset.sk) {
                box.dataset.sk = '1';
                box.innerHTML = '<div class="sp-row hdr" id="spHdr"><span></span><span></span><span></span><span></span></div><div id="spRows"></div><div class="sp-empty" id="spMsg" style="display:none"></div>';
            }
            const rowsBox = $('spRows'), msgBox = $('spMsg');
            const url = currentWsUrl(), base = apiBase(url), now = Date.now();
            setText($('spMode'), base === '' ? tt('offlineMode') : (base === null ? 'ws:// / wss://' : tt('onlineMode')));
            $('tabLobby').classList.toggle('active', activeTab === 'lobby'); $('tabDuel').classList.toggle('active', activeTab === 'duel');
            setText($('spNote'), base === '' ? tt('noteOffline') : (activeTab === 'duel' ? tt('noteDuel') : tt('noteLobby')));
            const hs = $('spHdr').children; [tt('name'), tt('players'), tt('status'), ''].forEach((x, i) => setText(hs[i], x));
            const live = $('spLive'), streaming = !!es && es.readyState === 1;
            live.className = 'sp-live' + (streaming ? '' : ' off');
            setText(live, base ? ((streaming ? tt('live') : tt('liveOff')) + (lastList && !lastList.error ? ' · ' + lastList.online + ' ' + tt('online') : '')) : '—');

            const showMsg = (t) => { rowsBox.style.display = 'none'; msgBox.style.display = 'block'; setText(msgBox, t); for (const r of rowEls.values()) r.el.remove(); rowEls.clear(); };
            let list;
            if (base === '') {   // çevrimdışı: tek yerel satır
                list = [activeTab === 'duel'
                    ? { id: '__local_duel', name: tt('localDuel'), kind: 'duel', players: 1, max: 2, countdown: null, wait: null, at: now, infoText: tt('localDuelInfo') }
                    : { id: '__local_lobby', name: tt('local'), kind: 'lobby', players: 1, max: 20, countdown: null, wait: null, at: now, infoText: tt('localInfo') }];
                setText($('tabLobbyC'), ''); setText($('tabDuelC'), '');
            } else if (base === null) { setText($('tabLobbyC'), ''); setText($('tabDuelC'), ''); return showMsg(tt('unreachable')); }
            else if (!lastList) { return showMsg('…'); }
            else if (lastList.error) { return showMsg(tt('unreachable')); }
            else {
                const open = (k) => lastList.servers.filter(x => x.kind === k && x.players < x.max).length;
                setText($('tabLobbyC'), open('lobby') + ' ' + tt('open')); setText($('tabDuelC'), open('duel') + ' ' + tt('open'));
                list = lastList.servers.filter(x => x.kind === activeTab).map(x => Object.assign({}, x, { at: lastList.at }));
                list.sort((a, b) => idNum(a.id) - idNum(b.id));
                if (!list.length) return showMsg(tt('noServers'));
            }
            msgBox.style.display = 'none'; rowsBox.style.display = 'block';
            const keep = new Set(list.map(x => x.id));
            for (const [id, r] of Array.from(rowEls)) if (!keep.has(id)) { r.el.remove(); rowEls.delete(id); }   // başlayan oda anında kaybolur
            const initial = rowEls.size === 0;   // ilk doldurma / sekme değişimi: parlama yok, sadece sonradan açılan odalar parlar
            list.forEach((sv, i) => {
                let r = rowEls.get(sv.id);
                if (!r) { r = makeRow(initial); rowEls.set(sv.id, r); }
                paintRow(r, sv, now);
                if (rowsBox.children[i] !== r.el) rowsBox.insertBefore(r.el, rowsBox.children[i] || null);
            });
        }

        let es = null, esBase = '';
        function closeStream() { if (es) { try { es.close(); } catch (e) { /* */ } es = null; esBase = ''; } }
        function openStream() {
            const base = apiBase(currentWsUrl());
            if (!base || typeof EventSource === 'undefined' || document.hidden) return closeStream();
            if (es && esBase === base) return;
            closeStream(); esBase = base;
            try { es = new EventSource(base + '/api/servers/stream'); } catch (e) { es = null; return; }
            es.onmessage = (ev) => { try { setList(JSON.parse(ev.data)); } catch (e) { /* */ } };
            es.onopen = () => renderServers();
            es.onerror = () => renderServers();
        }
        function setList(j) {
            lastList = (j && Array.isArray(j.servers)) ? { servers: j.servers.slice(0, 100), online: (j.online | 0), at: Date.now() } : { error: true };
            renderServers();
        }
        async function refreshServers(force) {
            openStream(); renderServers();
            const base = apiBase(currentWsUrl());
            if (!base || listBusy) return;
            if (document.hidden && !force) return;
            if (!force && es && es.readyState === 1 && lastList && !lastList.error && Date.now() - lastList.at < 25000) return;   // canlı akış güncel
            listBusy = true;
            const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 4000);
            try {
                const res = await fetch(base + '/api/servers', { signal: ac.signal, cache: 'no-store' });
                if (!res.ok) throw new Error('http ' + res.status);
                setList(await res.json());
            } catch (e) { lastList = { error: true }; renderServers(); }
            clearTimeout(to); listBusy = false;
        }
        function applyServerUrl() { lastList = null; closeStream(); store('px_server', ($('serverUrlInput').value || '').trim()); refreshServers(true); }
        setInterval(() => refreshServers(false), 3000);                      // yedek yoklama
        setInterval(() => { if (lastList && !lastList.error) renderServers(); }, 500);   // geri sayımı akıcı göster
        document.addEventListener('visibilitychange', () => { if (document.hidden) closeStream(); else refreshServers(true); });

        /* ------------------------------------------------------------ başlangıç */
        function defaultFlag() { // kayıtlı bayrak yoksa: kırmızı-beyaz-kırmızı + sarı yıldız
            $('pc1').value = '#d32f2f'; $('pc2').value = '#ffffff'; $('pc3').value = '#d32f2f';
            renderPattern('h3', largeCtx);
            const rows = SYMBOLS.star; largeCtx.fillStyle = '#ffd600';
            for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) if (rows[y][x] === '1') largeCtx.fillRect(10 + x, 3 + y, 1, 1);
            miniCtx.drawImage(largeCanvas, 0, 0, FW, FH); store('px_flag', flagToB64(miniCanvas));
            $('pc3').value = '#1b5e20';
            refreshPatternThumbs();
        }
        (function init() {
            miniCtx.fillStyle = 'white'; miniCtx.fillRect(0, 0, FW, FH);
            buildPatternGrid(); buildSymbolGrid();
            if (!b64ToCanvas(store('px_flag'), miniCanvas)) defaultFlag();
            $('countryInput').value = store('px_country') || '';
            $('countryInput').addEventListener('input', function (e) { e.target.classList.remove('err'); store('px_country', e.target.value.trim()); });
            $('countryInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') playGame(); });
            $('serverUrlInput').value = metaUrl() || store('px_server') || '';
            $('serverUrlInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') applyServerUrl(); });
            $('expVal').innerText = String(parseInt(store('px_exp') || '0', 10) || 0);
            applyLang();
            if (window.pxSyncLayoutButtons) pxSyncLayoutButtons();
            refreshServers(true);
        })();

        /* --- AYARLAR --- */
        function goToSettings() { $('settingsModal').style.display = 'flex'; }
        function closeSettings() { $('settingsModal').style.display = 'none'; }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSettings(); if ($('flagModal').style.display === 'flex') closeFlagEditor(false); } });
    </script>
</body>
